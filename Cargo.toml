[package]
name = "cocoa-rs"
version = "0.6.1"
edition = "2021"
rust-version = "1.91"
license = "MIT"
authors = ["Yongjin Park <ypp@stat.ubc.ca> <yongjin.park@ubc.ca>"]
description = "Counterfactual Confounder Adjustment for Differential Analysis"
repository = "https://github.com/causalpathlab/cocoa-rs"
homepage = "https://github.com/causalpathlab/cocoa-rs"
readme = "README.md"
keywords = ["genomics", "single-cell", "diffexp", "causal"]
categories = ["science", "command-line-utilities"]
exclude = [
    "**/.claude/**",
    "**/.DS_Store",
]

[[bin]]
name = "cocoa"
path = "src/main.rs"

[features]
default = []
cuda = [
    "legume-numeric/cuda",
]
metal = [
    "legume-numeric/metal",
]
hdf5 = ["data-beans/hdf5"]

[dependencies]
data-beans = { version = "0.10", default-features = false, features = ["aux", "alg", "sim"] }
legume-numeric = { version = "0.9", default-features = false, features = ["matrix", "param"] }

anyhow = "1.0"
clap = { version = "4.5.20", features = ["derive"] }
flate2 = "1.0.34"
num_cpus = "1.16.0"
rayon = "1.10.0"
tempfile = "3.2"
rand = "0.10.1"
rand_distr = "0.6"
nalgebra = "0.34"
nalgebra-sparse = "0.11"
approx = "0.5.1"

special = "0.14"
indicatif = { version = "^0.18", features = ["rayon"] }
log = "0.4"
env_logger = "0.11"
rustc-hash = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The MCP server under `cocoa mcp`, and following it from the views.
legume-mcp = { version = "0.4.4", features = ["clap", "tui", "sessions"] }
# The views of `cocoa simulate` and `cocoa diff`: detachable sessions, the
# children they run, the flags' form, the file browser, and the heatmap and
# its PDF.
legume-tui = { version = "0.3", default-features = false, features = ["clap", "logs", "child", "form", "browse", "chart", "export", "save", "map-display"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
# The genome figure on screen: the terminal's image protocol, or blocks.
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# Column types and row counts from a table's footer; the version legume-numeric uses.
parquet = { version = "59", default-features = false }

